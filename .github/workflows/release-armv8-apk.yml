name: Release ARMv8 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.4.529)'
        required: true
        default: 'v1.1.4.529'
      release_notes:
        description: 'Optional custom release notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" "${SDK_ROOT}/tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || command -v sdkmanager || true)"
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Release version metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG:-v1.1.4.529}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME="${TAG#v}"
          if [ -z "${VERSION_NAME}" ]; then
            VERSION_NAME="1.1.4.529"
          fi
          VERSION_CODE="${RUN_NUMBER:-1}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Release signing keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/upload-release.jks"
          rm -f "${KEYSTORE_FILE}"
          if [ -n "${SECRET_KEYSTORE_BASE64}" ] && [ -n "${SECRET_STORE_PASSWORD}" ] && [ -n "${SECRET_KEY_PASSWORD}" ]; then
            printf '%s' "${SECRET_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE_FILE}"
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
            KEYSTORE_PASS="${SECRET_STORE_PASSWORD}"
          elif [ -f .github/ci-release-cert.txt ]; then
            echo "::notice::Using repository fixed .github/ci-release-cert.txt signing certificate for consistent release upgrades."
            PASS="android"
            tr -d '[:space:]' < .github/ci-release-cert.txt | base64 --decode > "${KEYSTORE_FILE}"
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${PASS}" >> "$GITHUB_ENV"
            KEYSTORE_PASS="${PASS}"
          else
            if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 --decode > debug.keystore
            fi
            if [ ! -s debug.keystore ]; then
              echo "::error::Missing .github/ci-release-cert.txt and debug.keystore, and KEYSTORE_BASE64 secrets are not configured."
              exit 1
            fi
            echo "::notice::Using repository fixed debug.keystore signing certificate for consistent release upgrades."
            PASS="android"
            keytool -importkeystore \
              -srckeystore debug.keystore \
              -srcstorepass android \
              -srcalias androiddebugkey \
              -srckeypass android \
              -destkeystore "${KEYSTORE_FILE}" \
              -deststorepass "${PASS}" \
              -destalias upload \
              -destkeypass "${PASS}" \
              -noprompt
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${PASS}" >> "$GITHUB_ENV"
            KEYSTORE_PASS="${PASS}"
          fi
          SIGNING_SHA256="$(keytool -list -v -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASS}" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '\r\n' || true)"
          if [ -n "${SIGNING_SHA256}" ]; then
            echo "SIGNING_SHA256=${SIGNING_SHA256}" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build ARMv8 (arm64-v8a) Release APK
        env:
          CI_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          CI_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          CI_GITHUB_REPO: ${{ github.repository }}
        run: |
          gradle :app:assembleRelease \
            -Parmv8Only \
            -PciVersionName="${CI_VERSION_NAME}" \
            -PciVersionCode="${CI_VERSION_CODE}" \
            -PciGithubRepo="${CI_GITHUB_REPO}" \
            --stacktrace

      - name: Package ARMv8 APK artifact
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p dist
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_SRC}" ]; then
            echo "::error::Expected release APK not found at ${APK_SRC}"
            find app/build/outputs/apk -maxdepth 3 -type f || true
            exit 1
          fi
          APK_DEST="dist/xiaobenben-${TAG}-arm64-v8a.apk"
          cp "${APK_SRC}" "${APK_DEST}"
          APK_BYTES="$(stat -c%s "${APK_DEST}" 2>/dev/null || wc -c < "${APK_DEST}")"
          APK_SIZE_HR="$(awk -v b="${APK_BYTES}" 'BEGIN { printf "%.2f MB", b / 1048576 }')"
          echo "APK_SIZE_HR=${APK_SIZE_HR}" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Generate release changelog
        id: changelog
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git tag --sort=-v:refname | grep -Fxv "${TAG}" | head -n 1 || true)"

          {
            echo "## 小本本 ${TAG} (ARMv8 / arm64-v8a)"
            echo ""
            echo "- 仓库：https://github.com/${GITHUB_REPOSITORY:-wahkawakah1145/xiaobenben}"
            echo "- 包名：\`com.live150yo.lvshuiqingshan\`"
            echo "- 架构：\`arm64-v8a\` (ARMv8)"
            if [ -n "${APK_SIZE_HR:-}" ]; then
              echo "- 安装包体积：\`${APK_SIZE_HR}\`"
            fi
            echo "- 系统要求：Android 11 (API 30)+ · Target Android 17 (API 37)"
            if [ -n "${SIGNING_SHA256:-}" ]; then
              echo "- 签名 SHA-256：\`${SIGNING_SHA256}\`"
            fi
            echo ""
          } > "${BODY_FILE}"

          if [ -n "${CUSTOM_NOTES}" ]; then
            {
              echo "### 发布说明"
              printf '%s\n' "${CUSTOM_NOTES}"
              echo ""
            } >> "${BODY_FILE}"
          fi

          if [ -f "CHANGELOG.md" ]; then
            {
              echo "### 更新日志"
              awk '
                /^## / {
                  if (seen) exit;
                  seen = 1;
                }
                seen { print }
              ' CHANGELOG.md
              echo ""
            } >> "${BODY_FILE}"
          fi

          {
            echo "### 提交记录"
            if [ -n "${PREV_TAG}" ] && git rev-parse --verify "${PREV_TAG}^{commit}" >/dev/null 2>&1; then
              echo "对比版本：\`${PREV_TAG}...${TAG}\`"
              echo ""
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" | head -n 40 || true
            else
              git log --no-merges -n 20 --pretty=format:"- %s (%h)" || true
            fi
            echo ""
          } >> "${BODY_FILE}"

          cat "${BODY_FILE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "小本本 ${{ steps.meta.outputs.tag }} (ARMv8 / arm64-v8a)"
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/xiaobenben-*-arm64-v8a.apk
