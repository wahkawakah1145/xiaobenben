name: Release ARMv8 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Optional custom release notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Release version metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Prepare Release signing keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/upload-release.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::notice::No custom KEYSTORE_BASE64 secret configured; generating an ephemeral release keystore for CI packaging."
            PASS="zhijizhang-ci-release"
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass "${PASS}" \
              -alias upload \
              -keypass "${PASS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ZhiJiZhang, OU=Android, O=Local, L=Beijing, S=Beijing, C=CN"
            echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${PASS}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${PASS}" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build ARMv8 (arm64-v8a) Release APK
        run: |
          gradle :app:assembleRelease \
            -Parmv8Only \
            -PciVersionName="${{ steps.meta.outputs.version_name }}" \
            -PciVersionCode="${{ steps.meta.outputs.version_code }}" \
            --stacktrace

      - name: Package ARMv8 APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/xiaobenben-${{ steps.meta.outputs.tag }}-arm64-v8a.apk"
          ls -lh dist/

      - name: Generate release changelog
        id: changelog
        run: |
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          TAG="${{ steps.meta.outputs.tag }}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git tag --sort=-v:refname | grep -Fxv "${TAG}" | head -n 1 || true)"

          {
            echo "## 小本本 ${TAG} (ARMv8 / arm64-v8a)"
            echo ""
            echo "- 包名：\`com.live150yo.lvshuiqingshan\`"
            echo "- 架构：\`arm64-v8a\` (ARMv8)"
            echo "- 最低系统要求：Android 7.0 (API 24)+"
            echo ""
          } > "${BODY_FILE}"

          CUSTOM_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -n "${CUSTOM_NOTES}" ]; then
            {
              echo "### 发布说明"
              echo "${CUSTOM_NOTES}"
              echo ""
            } >> "${BODY_FILE}"
          fi

          if [ -f "CHANGELOG.md" ]; then
            {
              echo "### 更新日志"
              awk '
                /^## / {
                  if (seen) exit;
                  seen = 1;
                }
                seen { print }
              ' CHANGELOG.md
              echo ""
            } >> "${BODY_FILE}"
          fi

          {
            echo "### 提交记录"
            if [ -n "${PREV_TAG}" ]; then
              echo "对比版本：\`${PREV_TAG}...${TAG}\`"
              echo ""
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" | head -n 40
            else
              git log --no-merges -n 20 --pretty=format:"- %s (%h)"
            fi
            echo ""
          } >> "${BODY_FILE}"

          cat "${BODY_FILE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "小本本 ${{ steps.meta.outputs.tag }} (ARMv8 / arm64-v8a)"
          body_path: ${{ runner.temp }}/release-body.md
          files: dist/xiaobenben-*-arm64-v8a.apk
